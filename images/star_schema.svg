<style>
 text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .title{font-size:28px;font-weight:700;fill:#F8FAFC}
 .sub{font-size:14px;fill:#94A3B8}
 .th{font-size:18px;font-weight:700;fill:#fff}
 .col{font-size:15px;fill:#E2E8F0}
 .pk{font-size:11px;font-weight:700;fill:#FBBF24}
 .fk{font-size:11px;font-weight:700;fill:#60A5FA}
 .calc{font-size:11px;font-weight:700;fill:#34D399}
 .card{font-size:12px;font-weight:700;fill:#F8FAFC}
 .lbl{font-size:12px;fill:#94A3B8;font-style:italic}
 .rel{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:7 7;animation:flow 1.4s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-14}}
 .tbl{animation:pop .7s ease-out both}
 @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
 .calcrow{animation:glow 2.4s ease-in-out infinite}
 @keyframes glow{0%,100%{fill-opacity:.14}50%{fill-opacity:.32}}
 @media (prefers-reduced-motion:reduce){.rel,.tbl,.calcrow{animation:none}}
</style>
